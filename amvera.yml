meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_SITE_URL: https://maestria-lms-maestro7it.amvera.io

run:
  containerPort: 3000
  health:
    path: /api/health
    interval: 30
    timeout: 10
    initialDelay: 40
    retries: 3
  resources:
    memory: 512
    cpu: 0.5
